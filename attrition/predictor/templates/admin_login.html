<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #241E24;

            font-family:
                'Trebuchet MS',
                Arial,
                sans-serif;

            color: #3B2938;
        }


        /* ================= LOGIN BOX ================= */

        .login-container {

            width: 100%;

            max-width: 420px;

            margin: 20px;

            background: #F4EFE6;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.3);
        }


        /* ================= ICON ================= */

        .admin-icon {

            width: 65px;

            height: 65px;

            margin: 0 auto 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #633F52;

            color: white;

            border-radius: 50%;

            font-size: 27px;
        }


        /* ================= HEADER ================= */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .header h1 {

            margin: 0 0 10px;

            color: #3B2938;

            font-family:
                Georgia,
                'Times New Roman',
                serif;

            font-size: 28px;

            letter-spacing: 1px;
        }


        .header p {

            margin: 0;

            color: #6B6065;

            font-size: 14px;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #633F52;

            font-size: 13px;

            font-weight: bold;
        }


        .form-group input {

            width: 100%;

            padding: 12px 14px;

            border:
                1px solid #C9BDB0;

            border-radius: 8px;

            background: #FBF8F2;

            color: #3B2938;

            font-size: 14px;

            outline: none;
        }


        .form-group input:focus {

            border-color: #633F52;

            box-shadow:
                0 0 0 2px
                rgba(99, 63, 82, 0.12);
        }


        /* ================= ERROR ================= */

        .error {

            background: #F1DDD7;

            color: #8B3E2F;

            border:
                1px solid #D8B4A9;

            border-radius: 8px;

            padding: 11px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 13px;
        }


        /* ================= LOGIN BUTTON ================= */

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #633F52;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-button:hover {

            background: #7B4D61;

            transform:
                translateY(-2px);

            box-shadow:
                0 6px 15px
                rgba(99, 63, 82, 0.30);
        }


        /* ================= FOOTER ================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #8A7F83;

            font-size: 11px;
        }


        @media (max-width: 500px) {

            .login-container {

                padding: 30px 25px;
            }


            .header h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- ADMIN ICON -->

    <div class="admin-icon">

        🔐

    </div>


    <!-- HEADER -->

    <div class="header">

        <h1>
            ADMIN LOGIN
        </h1>

        <p>
            Employee Attrition Prediction System
        </p>

    </div>


    <!-- ERROR -->

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="username">

                Username

            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button">

            LOGIN

        </button>

    </form>


    <!-- FOOTER -->

    <div class="footer">

        Employee Attrition Prediction System

    </div>


</div>


</body>

</html>
